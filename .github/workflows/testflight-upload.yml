name: Signed TestFlight upload

on:
  workflow_dispatch:

permissions:
  contents: read

# One release pipeline at a time, including retries. Do not cancel signing or
# uploading to make room for a newer run. This is separate from both other CIs.
concurrency:
  group: fitphotos-testflight-upload
  cancel-in-progress: false

jobs:
  tests:
    name: Existing Simulator test suite
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FITPHOTO_EXPECTED_XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release safeguards with synthetic data and no secrets
        shell: bash
        run: python3 -m unittest discover -s Scripts/Tests -p 'test_testflight_*.py'
      - name: Run the unchanged build and all existing tests
        shell: bash
        run: bash Scripts/validate-on-mac.sh

  release:
    name: Validate signing, archive, export, validate, upload
    needs: tests
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 60
    # Configure this environment to permit only your default branch. Repository
    # secrets with the six documented names work; no new secret is required.
    environment: testflight
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FITPHOTO_EXPECTED_XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create private temporary workspace
        id: private
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 Scripts/testflight_release.py --prepare

      - name: Sign and upload using temporary credentials
        shell: bash
        env:
          TESTFLIGHT_WORK_DIR: ${{ steps.private.outputs.work_dir }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          python3 Scripts/testflight_release.py --release

      - name: Always remove signing material and restore keychain search list
        if: always() && steps.private.outputs.work_dir != ''
        shell: bash
        env:
          TESTFLIGHT_WORK_DIR: ${{ steps.private.outputs.work_dir }}
        run: |
          set +x
          set -euo pipefail
          python3 Scripts/testflight_release.py --cleanup

      # Intentionally no upload-artifact step: no signed IPA, archive, profile,
      # certificate, keychain, raw tool log, or API material leaves the runner
      # except the validated IPA uploaded directly to Apple.
